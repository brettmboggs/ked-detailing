# Config for the visual editor at https://app.pagescms.org
# Jacob signs in with GitHub, picks this repo, and edits the entries below.
# Saving commits to the repo, which rebuilds and deploys the site.

media:
  - name: merch
    label: Merch photos
    input: src/assets/merch
    output: src/assets/merch
  - name: blog
    label: Post images
    input: src/assets/blog
    output: src/assets/blog

content:
  - name: products
    label: Merch
    type: collection
    path: src/content/products
    filename: '{fields.name}.yaml'
    view:
      fields: [name, price, draft]
      primary: name
    fields:
      - name: name
        label: Product name
        type: string
        required: true
      - name: price
        label: Price
        type: string
        required: true
        description: Type it exactly as it should appear, e.g. $65
      - name: blurb
        label: Short description
        type: text
        description: One or two lines shown under the name.
      - name: photo
        label: Photo
        type: image
        options:
          media: merch
        description: Square images look best.
      - name: href
        label: Link to buy
        type: string
        required: true
        description: The product page on your merch store.
      - name: tag
        label: Badge
        type: string
        description: Optional, e.g. New or Limited. Leave blank for none.
      - name: order
        label: Sort order
        type: number
        description: Lower numbers show first.
      - name: draft
        label: Hide from the site
        type: boolean

  - name: posts
    label: Notes
    type: collection
    path: src/content/posts
    filename: '{fields.title}.md'
    view:
      fields: [title, pubDate, draft]
      primary: title
      sort: [pubDate]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Search summary
        type: text
        description: One or two sentences. Shown on the blog index and in Google results.
      - name: pubDate
        label: Date
        type: date
        required: true
      - name: hero
        label: Header image
        type: image
        options:
          media: blog
        description: Landscape works best.
      - name: heroAlt
        label: Image description
        type: string
        description: For screen readers. Describe what is in the photo.
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Hide from the site
        type: boolean
      - name: body
        label: Post
        type: rich-text

  - name: settings
    label: Store settings
    type: file
    path: src/data/store-settings.json
    fields:
      - name: storefrontUrl
        label: Full shop link
        type: string
        description: Optional. Adds a "See the full shop" button under the products.
      - name: blurbPreLaunch
        label: Text shown before any products exist
        type: text
      - name: blurbLive
        label: Text shown once products are live
        type: text
